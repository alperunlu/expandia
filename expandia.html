<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empire Clash - Enhanced Strategy Game</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
  <style>
  
  :root {
  --bg-color: #0a0f1e;
  --primary: #ff00ff;
  --secondary: #00f0ff;
  --accent: #ffea00;
  --danger: #ff0033;
  --success: #00ff66;
  --text-light: #e0e0ff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Orbitron', 'Arial', sans-serif;
  background: var(--bg-color);
  color: var(--text-light);
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  display: flex;
  flex-direction: column;
  letter-spacing: 0.5px;
}

#gameContainer {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 10px;
}

#uiContainer {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  padding: 10px;
  background: rgba(20, 20, 40, 0.8);
  border: 1px solid var(--primary);
  border-radius: 12px;
  box-shadow: 0 0 15px var(--primary);
}

.resource {
  display: flex;
  align-items: center;
  background: rgba(0, 0, 0, 0.6);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 14px;
  color: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.choice-btn {
  padding: 10px 14px;
  border: 1px solid var(--secondary);
  border-radius: 8px;
  font-weight: bold;
  font-size: 12px;
  cursor: pointer;
  background: linear-gradient(145deg, rgba(0, 255, 255, 0.2), rgba(255, 0, 255, 0.2));
  color: var(--text-light);
  text-transform: uppercase;
  box-shadow: 0 0 10px var(--secondary), inset 0 0 5px var(--secondary);
  transition: transform 0.2s ease, box-shadow 0.3s ease;
}

.choice-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 20px var(--primary), inset 0 0 10px var(--primary);
}

.choice-btn:active {
  transform: scale(0.95);
}

#phaser-game-container {
  width: 100%;
  max-width: 900px;
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-top: 10px;
  border: 2px solid var(--primary);
  border-radius: 12px;
  box-shadow: 0 0 20px var(--primary);
  overflow: hidden;
}

#messageBox {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(30, 0, 40, 0.85);
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 16px;
  color: var(--accent);
  text-align: center;
  box-shadow: 0 0 15px var(--accent);
  opacity: 0;
  transition: opacity 0.3s;
}

#restartContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(10, 10, 30, 0.95);
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 20px var(--secondary);
  text-align: center;
  display: none;
}

#restartBtn {
  padding: 12px 24px;
  background: var(--primary);
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  color: black;
  font-weight: bold;
  box-shadow: 0 0 15px var(--primary);
}

#restartBtn:hover {
  background: var(--secondary);
  box-shadow: 0 0 25px var(--secondary);
}

  @media (min-width: 1024px) {
  #gameContainer {
    grid-template-rows: 1fr;
    grid-template-columns: 250px 1fr 250px; /* sol, oyun alanı, sağ */
    align-items: start;
    padding: 20px;
  }

  #uiContainer {
    grid-column: 1;
    grid-row: 1;
    align-self: start;
  }

  #phaser-game-container {
    grid-column: 1;
    grid-row: 2;
  }

  #mobileControls {
    grid-column: 3;
    grid-row: 1;
    justify-content: center;
  }
}

<body>
  <div id="gameContainer">
    <div id="uiContainer">
      <div id="playerResources">
        <div class="resource">
          <span>💰: <span id="economyValue">1</span></span>
        </div>
        <div class="resource">

        </div>
        <div class="resource">
          <span>🎨: <span id="cultureValue">1</span></span>
        </div>
        <div class="resource">
          <span>🔬: <span id="scienceValue">1</span></span>
        </div>

          <span>🎯: <span id="specialValue">0</span>/5</span>
        </div>

      <div id="controls">
        <button id="economyBtn" class="choice-btn">Econ (E)</button>
        <button id="militaryBtn" class="choice-btn">Mil (M)</button>

        <button id="scienceBtn" class="choice-btn">Sci (S)</button>
        <button id="specialBtn" class="choice-btn">Special (X)</button>

        <div id="gamepadE" class="gamepad-btn">E</div>
        <div id="gamepadM" class="gamepad-btn">M</div>
        <div id="gamepadX" class="gamepad-btn">X</div>
        <div id="gamepadC" class="gamepad-btn">C</div>
      </div>
    </div>
    
    <div id="messageBox"></div>
    <div id="restartContainer">
      <h2 id="gameResultText">Game Over</h2>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <script>
    // Game configuration
    const config = {
      type: Phaser.AUTO,
      width: 800,
      height: 600,
      parent: 'phaser-game',
      backgroundColor: '#1a1a2e',
      scene: {
        preload: preload,
        create: create,
        update: update
      },
      // Ekran boyutlandırma ayarları
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 800,
        height: 600
      }
    };

    // Initialize the game
    const game = new Phaser.Game(config);
    
    // Game constants
    const ROWS = 10;
    const COLS = 10;
    let CELL_SIZE = 60; // Başlangıç değeri, create içinde güncellenecek
    
    // Game state variables
    let grid = [];
    let playerCells = [];
    let aiCells = [];
    let graphics;
    let sceneContext;
    let playerResources = {
      economy: 1,
      military: 1,
      culture: 1,
      science: 1,
      special: 0
    };
    let aiResources = {
      economy: 1,
      military: 1,
      culture: 1,
      science: 1
    };
    let selectionTexts = [];
    let lastPlayerActionTime = 0;
    let playerActionCooldown = 300;
    let lastAIActionTime = 0;
    let aiActionCooldown = 400;
    let gameActive = true;
    let gameEnded = false;
    let specialAbilityCooldown = 0;
    let difficulty = "normal";
    
    // AI special ability variables
    let aiSpecialCharge = 0;
    let aiSpecialCooldown = 0;

    // 4'lü taş-kağıt-makas dengesi
    const beats = {
      S: "E", // Science beats Economy
      E: "M", // Economy beats Military
      M: "C", // Military beats Culture
      C: "S"  // Culture beats Science
    };

    // Preload assets
    function preload() {
      // Load assets for enhanced visuals
    }

    // Initialize the game
    function create() {
      sceneContext = this;
      graphics = this.add.graphics();
      
      // Hücre boyutunu ekrana göre ayarla
      const gameWidth = this.sys.game.config.width;
      const gameHeight = this.sys.game.config.height;
      CELL_SIZE = Math.min(gameWidth / COLS, gameHeight / ROWS);
      
      drawGrid();

      // Starting positions for player and AI
      let pStart = {r: Math.floor(ROWS/2), c: Math.floor(COLS/4)};
      let aStart = {r: Math.floor(ROWS/2), c: Math.floor(3*COLS/4)};
      claimCell(pStart.r, pStart.c, 0x4cd964, 1, "E");
      claimCell(aStart.r, aStart.c, 0xff3b30, 2, "M");
      playerCells.push({...pStart, type: "E"});
      aiCells.push({...aStart, type: "M"});

      // UI update
      updateUI();
      
      // Input handlers
      this.input.keyboard.on('keydown-E', () => tryPlayerAction("E"));
      this.input.keyboard.on('keydown-M', () => tryPlayerAction("M"));
      this.input.keyboard.on('keydown-C', () => tryPlayerAction("C"));
      this.input.keyboard.on('keydown-S', () => tryPlayerAction("S"));
      this.input.keyboard.on('keydown-X', () => useSpecialAbility());
      
      // Button events
      document.getElementById('economyBtn').addEventListener('click', () => tryPlayerAction("E"));
      document.getElementById('militaryBtn').addEventListener('click', () => tryPlayerAction("M"));
      document.getElementById('cultureBtn').addEventListener('click', () => tryPlayerAction("C"));
      document.getElementById('scienceBtn').addEventListener('click', () => tryPlayerAction("S"));
      document.getElementById('specialBtn').addEventListener('click', () => useSpecialAbility());
      document.getElementById('difficultySelect').addEventListener('change', (e) => {
        difficulty = e.target.value;
        updateAIDifficulty();
      });
      
      // Mobil gamepad events
      document.getElementById('gamepadE').addEventListener('click', () => tryPlayerAction("E"));
      document.getElementById('gamepadM').addEventListener('click', () => tryPlayerAction("M"));
      document.getElementById('gamepadC').addEventListener('click', () => tryPlayerAction("C"));
      document.getElementById('gamepadS').addEventListener('click', () => tryPlayerAction("S"));
      document.getElementById('gamepadX').addEventListener('click', () => useSpecialAbility());
      
      // Touch events for mobile
      const addTouchEvent = (element, action) => {
        element.addEventListener('touchstart', (e) => {
          e.preventDefault();
          action();
        }, { passive: false });
      };
      
      addTouchEvent(document.getElementById('gamepadE'), () => tryPlayerAction("E"));
      addTouchEvent(document.getElementById('gamepadM'), () => tryPlayerAction("M"));
      addTouchEvent(document.getElementById('gamepadC'), () => tryPlayerAction("C"));
      addTouchEvent(document.getElementById('gamepadS'), () => tryPlayerAction("S"));
      addTouchEvent(document.getElementById('gamepadX'), () => useSpecialAbility());
      
      // Restart button
      document.getElementById('restartBtn').addEventListener('click', () => {
        // Sayfayı yeniden yükle
        location.reload();
      });
      
      // Game instructions
      showMessage("Welcome to Empire Clash! Use E, M, C, S keys or buttons. Press X for special ability!");
    }

    // Draw the game grid
    function drawGrid() {
      graphics.clear();
      graphics.lineStyle(1, 0xffffff, 0.1);
      
      for (let i = 0; i <= ROWS; i++) {
        graphics.moveTo(0, i * CELL_SIZE);
        graphics.lineTo(COLS * CELL_SIZE, i * CELL_SIZE);
      }
      
      for (let j = 0; j <= COLS; j++) {
        graphics.moveTo(j * CELL_SIZE, 0);
        graphics.lineTo(j * CELL_SIZE, ROWS * CELL_SIZE);
      }
      
      graphics.strokePath();
      
      // Initialize grid
      for (let i = 0; i < ROWS; i++) {
        grid[i] = [];
        for (let j = 0; j < COLS; j++) {
          grid[i][j] = {owner: 0, type: null};
        }
      }
    }

    // Claim a cell for a player or AI
    function claimCell(row, col, color, owner, type) {
      grid[row][col] = {owner, type};
      
      // Draw cell with gradient for visual appeal
      graphics.fillStyle(color, 1);
      graphics.fillRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      
      // Cell border
      graphics.lineStyle(2, 0xffffff, 0.5);
      graphics.strokeRect(col * CELL_SIZE, row * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      
      // Icon for cell type (E, M, C, S)
      if (type && sceneContext) {
        // Remove any existing text at this position
        selectionTexts = selectionTexts.filter(text => {
          if (Math.floor(text.x / CELL_SIZE) === col && Math.floor(text.y / CELL_SIZE) === row) {
            text.destroy();
            return false;
          }
          return true;
        });
        
        const text = sceneContext.add.text(
          col * CELL_SIZE + CELL_SIZE / 2, 
          row * CELL_SIZE + CELL_SIZE / 2, 
          type, 
          {
            fontSize: Math.floor(CELL_SIZE / 2.5) + 'px',
            color: '#ffffff',
            fontStyle: 'bold',
            stroke: '#000000',
            strokeThickness: Math.floor(CELL_SIZE / 15)
          }
        );
        text.setOrigin(0.5, 0.5);
        selectionTexts.push(text);
      }
    }

    // Main game loop
    function update(time, delta) {
      if (!gameActive) return;
      
      // Update special ability cooldown
      if (specialAbilityCooldown > 0) {
        specialAbilityCooldown -= delta;
        if (specialAbilityCooldown < 0) specialAbilityCooldown = 0;
      }
      
      // Update AI special ability cooldown
      if (aiSpecialCooldown > 0) {
        aiSpecialCooldown -= delta;
      }
      
      // AI acts independently at regular intervals
      const now = Date.now();
      if (now - lastAIActionTime > aiActionCooldown) {
        lastAIActionTime = now;
        tryAIAction();
      }
      
      // Check game state continuously
      checkGameState();
    }

    // Expand territory for a player or AI
    function expand(cells, color, owner, choice, isPlayer) {
      let candidates = [];
      const resources = isPlayer ? playerResources : aiResources;
      
      // Increase the resource level for the chosen type
      resources[getResourceType(choice)] += 1;
      
      // Gain special points for player
      if (isPlayer) {
        playerResources.special += 1;
        if (playerResources.special > 5) playerResources.special = 5;
      } else {
        // Gain special points for AI
        aiSpecialCharge += 1;
        if (aiSpecialCharge > 5) aiSpecialCharge = 5;
      }
      
      updateUI();
      
      // Find all possible expansion candidates
      for (let cell of cells) {
        let neighbors = [
          {r: cell.r-1, c: cell.c},
          {r: cell.r+1, c: cell.c},
          {r: cell.r, c: cell.c-1},
          {r: cell.r, c: cell.c+1},
          // Diagonal moves for more options
          {r: cell.r-1, c: cell.c-1},
          {r: cell.r-1, c: cell.c+1},
          {r: cell.r+1, c: cell.c-1},
          {r: cell.r+1, c: cell.c+1}
        ];
        
        for (let n of neighbors) {
          if (n.r>=0 && n.r<ROWS && n.c>=0 && n.c<COLS) {
            let target = grid[n.r][n.c];
            if (target.owner === 0) {
              // Empty cell → can always take
              candidates.push({pos: n, takeover: false});
            } else if (target.owner !== owner) {
              // Enemy cell → battle will happen
              candidates.push({pos: n, takeover: true, defenderType: target.type});
            }
          }
        }
      }
      
      if (candidates.length > 0) {
        // Select a random candidate
        let selectedCell = Phaser.Utils.Array.GetRandom(candidates);
        
        if (!selectedCell.takeover) {
          // Take empty cell
          claimCell(selectedCell.pos.r, selectedCell.pos.c, color, owner, choice);
          cells.push({...selectedCell.pos, type: choice});
          
          // Visual effect for expansion
          createExpansionEffect(selectedCell.pos.c, selectedCell.pos.r, color);
          
          return {pos: selectedCell.pos, won: true, message: "Territory gained!"};
        } else {
          // Enemy cell → resolve with rock-paper-scissors and resource comparison
          const attackerResources = isPlayer ? playerResources : aiResources;
          const defenderResources = isPlayer ? aiResources : playerResources;
          
          const attackerType = choice;
          const defenderType = selectedCell.defenderType;
          
          const attackerPower = attackerResources[getResourceType(choice)];
          const defenderPower = defenderResources[getResourceType(defenderType)];
          
          // Gelişmiş savaş mekaniği
          let battleResult = calculateBattleResult(attackerType, defenderType, attackerPower, defenderPower);
          
          if (battleResult.win) {
            // Attacker wins → take enemy's cell
            claimCell(selectedCell.pos.r, selectedCell.pos.c, color, owner, choice);
            
            // Remove old cell from list
            if (owner === 1) {
              aiCells = aiCells.filter(c => c.r !== selectedCell.pos.r || c.c !== selectedCell.pos.c);
            } else {
              playerCells = playerCells.filter(c => c.r !== selectedCell.pos.r || c.c !== selectedCell.pos.c);
            }
            
            cells.push({...selectedCell.pos, type: choice});
            
            // Visual effect for battle win
            createBattleEffect(selectedCell.pos.c, selectedCell.pos.r, color, true);
            
            return {pos: selectedCell.pos, won: true, message: battleResult.message};
          } else {
            // Lose → nothing happens
            createBattleEffect(selectedCell.pos.c, selectedCell.pos.r, 0x888888, false);
            return {pos: selectedCell.pos, won: false, message: battleResult.message};
          }
        }
      }
      return null;
    }

    // Gelişmiş savaş sonucu hesaplama
    function calculateBattleResult(attackerType, defenderType, attackerPower, defenderPower) {
      // Aynı türde çarpışma
      if (attackerType === defenderType) {
        if (attackerPower > defenderPower) {
          return {win: true, message: "Won with superior resources!"};
        } else if (defenderPower > attackerPower) {
          return {win: false, message: "Lost to superior resources!"};
        } else {
          // Eşit güç - rastgele sonuç
          return {win: Math.random() > 0.5, message: "Narrow victory/loss in equal battle!"};
        }
      }
      
      // Tür avantajı kontrolü
      const hasTypeAdvantage = beats[attackerType] === defenderType;
      const hasTypeDisadvantage = beats[defenderType] === attackerType;
      
      // Tür avantajı varsa
      if (hasTypeAdvantage) {
        const winChance = attackerPower / (attackerPower + defenderPower);
        const win = Math.random() < winChance;
        
        if (win) {
          return {win: true, message: `Won with type advantage!`};
        } else {
          return {win: false, message: `Type advantage wasn't enough!`};
        }
      }
      
      // Tür dezavantajı varsa
      if (hasTypeDisadvantage) {
        const winChance = attackerPower / (attackerPower + defenderPower * 2); // Dezavantajlı durum
        const win = Math.random() < winChance;
        
        if (win) {
          return {win: true, message: `Overcame type disadvantage!`};
        } else {
          return {win: false, message: `Lost due to type disadvantage!`};
        }
      }
      
      // Normal çarpışma (tür avantajı/dezavantajı yok)
      const winChance = attackerPower / (attackerPower + defenderPower);
      const win = Math.random() < winChance;
      
      if (win) {
        return {win: true, message: `Won with resource advantage!`};
      } else {
        return {win: false, message: `Lost to resource advantage!`};
      }
    }

    // Create visual effect for expansion
    function createExpansionEffect(x, y, color) {
      const effect = sceneContext.add.graphics();
      effect.fillStyle(color, 0.5);
      effect.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      
      sceneContext.tweens.add({
        targets: effect,
        alpha: 0,
        duration: 500,
        onComplete: () => effect.destroy()
      });
    }

    // Create visual effect for battle
    function createBattleEffect(x, y, color, success = true) {
      const effect = sceneContext.add.graphics();
      effect.lineStyle(4, color, 1);
      effect.strokeRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      
      sceneContext.tweens.add({
        targets: effect,
        alpha: 0,
        duration: 700,
        onComplete: () => effect.destroy()
      });
    }

    // Convert choice letter to resource type
    function getResourceType(choice) {
      switch(choice) {
        case "E": return "economy";
        case "M": return "military";
        case "C": return "culture";
        case "S": return "science";
        default: return "economy";
      }
    }

    // Handle player action
    function tryPlayerAction(playerChoice) {
      if (!gameActive) return;
      
      const now = Date.now();
      if (now - lastPlayerActionTime < playerActionCooldown) return;
      lastPlayerActionTime = now;
      
      // Player expands
      const playerResult = expand(playerCells, 0x4cd964, 1, playerChoice, true);
      
      if (playerResult) {
        highlightChoice(playerChoice, true);
        showMessage(`You used ${getChoiceName(playerChoice)}: ${playerResult.message}`);
      } else {
        showMessage(`You strengthened your ${getChoiceName(playerChoice)} but couldn't expand!`);
      }
    }

    // Use player's special ability
    function useSpecialAbility() {
      if (!gameActive || playerResources.special < 5 || specialAbilityCooldown > 0) return;
      
      playerResources.special = 0;
      specialAbilityCooldown = 10000; // 10 seconds cooldown
      updateUI();
      
      // Special ability: Convert only adjacent enemy cells
      let converted = 0;
      
      // Find all adjacent enemy cells
      let adjacentEnemyCells = [];
      for (let cell of playerCells) {
        let neighbors = [
          {r: cell.r-1, c: cell.c},
          {r: cell.r+1, c: cell.c},
          {r: cell.r, c: cell.c-1},
          {r: cell.r, c: cell.c+1}
        ];
        
        for (let n of neighbors) {
          if (n.r>=0 && n.r<ROWS && n.c>=0 && n.c<COLS) {
            let target = grid[n.r][n.c];
            if (target.owner === 2) { // Enemy cell
              // Check if this cell was already added
              const alreadyAdded = adjacentEnemyCells.some(c => c.r === n.r && c.c === n.c);
              if (!alreadyAdded) {
                adjacentEnemyCells.push({r: n.r, c: n.c, type: target.type});
              }
            }
          }
        }
      }
      
      // Convert these cells
      for (let enemyCell of adjacentEnemyCells) {
        claimCell(enemyCell.r, enemyCell.c, 0x4cd964, 1, "S"); // Convert to player
        playerCells.push({r: enemyCell.r, c: enemyCell.c, type: "S"});
        aiCells = aiCells.filter(c => c.r !== enemyCell.r || c.c !== enemyCell.c);
        converted++;
        
        // Special effect for conversion
        createExpansionEffect(enemyCell.c, enemyCell.r, 0x00ff00);
      }
      
      if (converted > 0) {
        showMessage(`Special ability converted ${converted} adjacent enemy cells!`);
      } else {
        showMessage("Special ability used but no adjacent enemy cells found!");
        // Don't waste special ability if no targets
        playerResources.special = 5;
        specialAbilityCooldown = 0;
      }
      
      updateUI();
    }

    // Handle AI action
    function tryAIAction() {
      if (!gameActive) return;
      
      // AI makes a choice based on its resources and strategy
      let aiChoice = calculateAIChoice();
      
      // AI expands
      const aiResult = expand(aiCells, 0xff3b30, 2, aiChoice, false);
      
      // AI special ability chance (based on difficulty)
      if (aiSpecialCharge === 5 && aiSpecialCooldown <= 0) {
        const useSpecialChance = difficulty === "easy" ? 0.1 : 
                                difficulty === "normal" ? 0.3 : 0.5;
                                
        if (Math.random() < useSpecialChance) {
          useAISpecialAbility();
        }
      }
      
      if (aiResult) {
        highlightChoice(aiChoice, false);
      }
    }

    // Use AI's special ability
    function useAISpecialAbility() {
      aiSpecialCharge = 0;
      aiSpecialCooldown = 10000; // 10 seconds cooldown
      
      // AI special ability: Convert only adjacent player cells
      let converted = 0;
      
      // Find all adjacent player cells
      let adjacentPlayerCells = [];
      for (let cell of aiCells) {
        let neighbors = [
          {r: cell.r-1, c: cell.c},
          {r: cell.r+1, c: cell.c},
          {r: cell.r, c: cell.c-1},
          {r: cell.r, c: cell.c+1}
        ];
        
        for (let n of neighbors) {
          if (n.r>=0 && n.r<ROWS && n.c>=0 && n.c<COLS) {
            let target = grid[n.r][n.c];
            if (target.owner === 1) { // Player cell
              // Check if this cell was already added
              const alreadyAdded = adjacentPlayerCells.some(c => c.r === n.r && c.c === n.c);
              if (!alreadyAdded) {
                adjacentPlayerCells.push({r: n.r, c: n.c, type: target.type});
              }
            }
          }
        }
      }
      
      // Convert these cells
      for (let playerCell of adjacentPlayerCells) {
        claimCell(playerCell.r, playerCell.c, 0xff3b30, 2, "S"); // Convert to AI
        aiCells.push({r: playerCell.r, c: playerCell.c, type: "S"});
        playerCells = playerCells.filter(c => c.r !== playerCell.r || c.c !== playerCell.c);
        converted++;
        
        // Special effect for conversion
        createExpansionEffect(playerCell.c, playerCell.r, 0xff0000);
      }
      
      if (converted > 0) {
        showMessage(`AI used special ability and converted ${converted} of your cells!`);
      }
    }

    // Calculate AI's next move based on difficulty
    function calculateAIChoice() {
      let choice;
      
      switch(difficulty) {
        case "easy":
          // Easy AI - mostly random
          const options = ["E", "M", "C", "S"];
          choice = Phaser.Utils.Array.GetRandom(options);
          break;
          
        case "normal":
          // Normal AI - focuses on strongest resource
          let maxResource = "economy";
          const resources = ["economy", "military", "culture", "science"];
          
          for (let resource of resources) {
            if (aiResources[resource] > aiResources[maxResource]) {
              maxResource = resource;
            }
          }
          
          switch(maxResource) {
            case "economy": choice = "E"; break;
            case "military": choice = "M"; break;
            case "culture": choice = "C"; break;
            case "science": choice = "S"; break;
          }
          break;
          
        case "hard":
          // Hard AI - counters player's strongest resource
          let playerMaxResource = "economy";
          const playerResourcesList = ["economy", "military", "culture", "science"];
          
          for (let resource of playerResourcesList) {
            if (playerResources[resource] > playerResources[playerMaxResource]) {
              playerMaxResource = resource;
            }
          }
          
          // Counter strategy
          switch(playerMaxResource) {
            case "economy": choice = "S"; break; // Science beats Economy
            case "military": choice = "E"; break; // Economy beats Military
            case "culture": choice = "M"; break; // Military beats Culture
            case "science": choice = "C"; break; // Culture beats Science
          }
          break;
      }
      
      return choice;
    }

    // Update AI difficulty settings
    function updateAIDifficulty() {
      switch(difficulty) {
        case "easy":
          aiActionCooldown = 800; // Slower AI
          break;
        case "normal":
          aiActionCooldown = 400; // Normal speed
          break;
        case "hard":
          aiActionCooldown = 300; // Faster AI
          // Give AI a starting boost
          aiResources.economy += 1;
          aiResources.military += 1;
          aiResources.culture += 1;
          aiResources.science += 1;
          break;
      }
    }

    // Highlight cells of a specific type
    function highlightChoice(choice, isPlayer) {
      const color = isPlayer ? 0xffffff : 0xffcc00;
      const cells = isPlayer ? playerCells : aiCells;
      
      cells.forEach(cell => {
        if (cell.type === choice) {
          graphics.lineStyle(3, color, 1);
          graphics.strokeRect(cell.c * CELL_SIZE, cell.r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        }
      });
      
      // Remove highlight after 500ms
      setTimeout(() => {
        cells.forEach(cell => {
          if (cell.type === choice) {
            graphics.lineStyle(2, 0xffffff, 0.5);
            graphics.strokeRect(cell.c * CELL_SIZE, cell.r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
          }
        });
      }, 500);
    }

    // Update the UI with current resource values
    function updateUI() {
      document.getElementById('economyValue').textContent = playerResources.economy;
      document.getElementById('militaryValue').textContent = playerResources.military;
      document.getElementById('cultureValue').textContent = playerResources.culture;
      document.getElementById('scienceValue').textContent = playerResources.science;
      document.getElementById('specialValue').textContent = playerResources.special;
      
      // Enable/disable special ability button
      document.getElementById('specialBtn').disabled = 
        (playerResources.special < 5 || specialAbilityCooldown > 0);
    }

    // Show a message to the player
    function showMessage(text) {
      const messageBox = document.getElementById('messageBox');
      messageBox.textContent = text;
      messageBox.style.opacity = 1;
      
      setTimeout(() => {
        messageBox.style.opacity = 0;
      }, 3000);
    }

    // Get the full name of a choice from its letter
    function getChoiceName(choice) {
      const names = { E: "Economy", M: "Military", C: "Culture", S: "Science" };
      return names[choice];
    }

    // Check if the game has ended
    function checkGameState() {
      if (gameEnded) return;
      
      // Check if game has ended
      if (playerCells.length === 0) {
        endGame("You lost! AI conquered your empire.", false);
      } else if (aiCells.length === 0) {
        endGame("Congratulations! You conquered the AI empire.", true);
      } else if (playerCells.length + aiCells.length === ROWS * COLS) {
        // All territory is occupied
        if (playerCells.length > aiCells.length) {
          endGame("Congratulations! You have a larger empire.", true);
        } else if (aiCells.length > playerCells.length) {
          endGame("You lost! AI has a larger empire.", false);
        } else {
          endGame("It's a tie! Both empires are equal size.", null);
        }
      }
    }

    // End the game and show results
    function endGame(message, victory) {
      gameActive = false;
      gameEnded = true;
      
      // Disable buttons
      const buttons = document.querySelectorAll('.choice-btn');
      buttons.forEach(btn => btn.disabled = true);
      
      // Show restart screen
      const restartContainer = document.getElementById('restartContainer');
      const gameResultText = document.getElementById('gameResultText');
      
      gameResultText.textContent = message;
      restartContainer.style.display = 'block';
      
      showMessage(message);
    }
  </script>
</body>
</html>
